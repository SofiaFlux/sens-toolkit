[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sens-mcp"
version = "0.1.1"
description = "MCP server and developer starter kit for the SENS Polish Energy Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SENS" }]
keywords = ["mcp", "model-context-protocol", "energy", "sens", "poland"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
sens-mcp = "sens_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sens_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real production SENS API over a real MCP stdio session; requires SENS_API_KEY, excluded by default (see addopts).",
]
addopts = "-m 'not live'"
