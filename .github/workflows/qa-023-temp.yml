name: Temporary MCP discovery regression

on:
  push:
    branches:
      - fix/qa-003-annual-kwh-int

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/test_client.py tests/test_discovery.py tests/test_server_tools.py
