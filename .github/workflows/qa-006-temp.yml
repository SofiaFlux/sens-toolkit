name: Temporary QA-006 operator region constraint

on:
  push:
    branches:
      - fix/qa-006-region-constraint
    paths:
      - .github/workflows/qa-006-temp.yml
      - src/sens_mcp/**
      - tests/test_qa006_region_constraint.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run QA-006 behavioral regression
        run: pytest -q tests/test_qa006_region_constraint.py
