name: Publish

# Tag-triggered, not on every push to main -- publishing a package version is a deliberate
# release action, not something that should happen on every merge. Push a tag matching the
# version in both pyproject.toml and npm-wrapper/package.json (e.g. v0.1.0) to release both.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # not used yet (no Trusted Publishing configured on PyPI), harmless to request
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
