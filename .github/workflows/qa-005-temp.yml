name: Temporary QA-005 tariff-components exact lookup

on:
  push:
    branches:
      - fix/qa-005-component-not-found
    paths:
      - .github/workflows/qa-005-temp.yml
      - src/sens_mcp/**
      - tests/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run QA-005 compatibility regression
        run: |
          pytest -q \
            tests/test_qa005_tariff_components_not_found.py \
            tests/test_client.py \
            tests/test_server_tools.py
