name: Temporary QA-032 market summary parity

on:
  push:
    branches:
      - fix/qa-032-market-summary-parity
    paths:
      - .github/workflows/qa-032-temp.yml
      - src/sens_mcp/**
      - tests/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run QA-005/006/032 compatibility regression
        run: |
          pytest -q \
            tests/test_qa005_component_not_found.py \
            tests/test_qa006_region_constraint.py \
            tests/test_qa032_market_parity.py \
            tests/test_formatter.py \
            tests/test_server_tools.py \
            tests/test_client.py
